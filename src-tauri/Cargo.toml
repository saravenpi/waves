[package]
name = "waves-desktop"
version = "0.1.0"
description = "Waves — a local-first music player with real-time visualizers"
authors = ["saravenpi"]
edition = "2021"

[lib]
name = "waves_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
lofty = "0.21"
dirs = "5"
base64 = "0.22"
walkdir = "2"
trash = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
