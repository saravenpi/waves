[package]
name = "waves"
version = "0.5.1"
edition = "2024"

[dependencies]
eframe = "0.30"
rodio = { version = "0.21", features = ["symphonia-all", "symphonia-isomp4", "symphonia-aac"] }
symphonia = { version = "0.5", features = ["all"] }
rustfft = "6.2"
cpal = "0.15"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
shellexpand = "3.1"
id3 = "1.13"
mp4ameta = "0.11"
metaflac = "0.2"
rfd = "0.15"
oggvorbismeta = "0.2"
dirs = "5.0"
winit = "0.30"
rand = "0.8"
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
objc-foundation = "0.1.1"
cocoa = "0.26.1"
raw-window-handle = "0.6"

[lints.rust]
unexpected_cfgs = "allow"
