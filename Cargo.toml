[package]
name = "waves"
version = "0.1.3"
edition = "2024"

[dependencies]
eframe = "0.30"
rodio = "0.19"
symphonia = { version = "0.5", features = ["all"] }
rustfft = "6.2"
cpal = "0.15"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
shellexpand = "3.1"
id3 = "1.13"
mp4ameta = "0.11"
metaflac = "0.2"
rfd = "0.15"
oggvorbismeta = "0.2"
dirs = "5.0"
winit = "0.30"
self_update = { version = "0.41", features = ["archive-tar", "archive-zip", "compression-flate2"] }
tokio = { version = "1.0", features = ["rt", "rt-multi-thread"] }
ureq = { version = "2.10", features = ["json"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc-foundation = "0.1"
cocoa = "0.25"
